<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#17b8d8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- The lens is a hole in the page: the tile's gradient shows through it. -->
    <mask id="lens">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="604" cy="592" r="128" fill="#000"/>
    </mask>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g mask="url(#lens)">
    <rect x="290" y="256" width="400" height="520" rx="48" fill="#0b1a5c" opacity=".28" filter="url(#blur)"/>
    <rect x="290" y="240" width="400" height="520" rx="48" fill="#ffffff"/>
    <rect x="342" y="310" width="190" height="24" rx="12" fill="#3a4fd6"/>
    <g fill="#c7d0e6">
      <rect x="342" y="374" width="290" height="18" rx="9"/>
      <rect x="342" y="420" width="250" height="18" rx="9"/>
      <rect x="342" y="466" width="150" height="18" rx="9"/>
    </g>
  </g>
  <circle cx="604" cy="592" r="128" fill="none" stroke="#ffffff" stroke-width="30"/>
  <path d="M700 688l92 92" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <g fill="#ffffff" opacity=".9">
    <rect x="540" y="566" width="128" height="20" rx="10"/>
    <rect x="540" y="606" width="84" height="20" rx="10"/>
  </g>
</svg>
